[package]
name = "liberarme-temp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "liberarme_temp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyvalues-parser = "0.2.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.4", features = ["json"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

[dev-dependencies]
# mockito spins up a fake local HTTP server just for tests, so we can
# simulate Steam API responses (success, 401, 403, bad JSON, etc.)
# without ever making a real network call during `cargo test`.
mockito = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
